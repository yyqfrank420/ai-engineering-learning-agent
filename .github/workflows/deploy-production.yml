name: Deploy production

# One-time frontend release runner. This workflow exists only on the operations
# branch; source checkout and deployment metadata are pinned to the reviewed tree.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 6990ff9a91dd6a32c060a0834bf17ba60411ddc2
  SOURCE_TREE: 0e3fae183411133951680ee33b240e942e19ac9f
  VERCEL_CLI_VERSION: 50.42.0
  EXPECTED_API_URL: https://agent-backend-qfgkz5atda-nw.a.run.app

jobs:
  frontend:
    name: Prepare reviewed frontend candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_IS_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6990ff9a91dd6a32c060a0834bf17ba60411ddc2
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION" --no-audit --no-fund

      - name: Prepare candidate without assigning production domains
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node --input-type=module <<'JS'
          import { loadEnvFile } from 'node:process';
          loadEnvFile('.vercel/.env.production.local');
          for (const name of ['VITE_API_URL', 'VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing required production variable: ${name}`);
          }
          if (process.env.VITE_API_URL !== process.env.EXPECTED_API_URL) throw new Error('Production backend URL differs from the approved backend');
          if (process.env.VITE_EVAL_AUTH_BOOTSTRAP && process.env.VITE_EVAL_AUTH_BOOTSTRAP !== 'false') throw new Error('Evaluation authentication bootstrap must be disabled in production');
          JS
          vercel build --prod --token="$VERCEL_TOKEN"
          grep -RFl --include='*.js' "$EXPECTED_API_URL" .vercel/output/static > /dev/null
          vercel deploy --prebuilt --prod --skip-domain --yes \
            --meta "releaseCommit=$SOURCE_COMMIT" \
            --meta "releaseTree=$SOURCE_TREE" \
            --meta "githubCommitSha=$SOURCE_COMMIT" \
            --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/frontend-candidate-url.txt"

      - name: Verify deployment identity and record public evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const env = process.env;
          const idPattern = /^dpl_[A-Za-z0-9]+$/;
          const hostPattern = /^[a-z0-9][a-z0-9.-]*\.vercel\.app$/;
          const candidateUrl = readFileSync(`${env.RUNNER_TEMP}/frontend-candidate-url.txt`, 'utf8').trim();
          if (!/^https:\/\/[a-z0-9][a-z0-9.-]*\.vercel\.app$/.test(candidateUrl)) {
            throw new Error('Deploy command did not return one Vercel deployment URL');
          }
          const reference = new URL(candidateUrl).hostname;
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(reference)}`);
          endpoint.searchParams.set('teamId', env.VERCEL_ORG_ID);
          endpoint.searchParams.set('withGitRepoInfo', 'true');
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${env.VERCEL_TOKEN}` },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Deployment verification returned HTTP ${response.status}`);
          const deployment = await response.json();
          if (!idPattern.test(deployment.id) || !hostPattern.test(deployment.url)) {
            throw new Error('Deployment identity is missing or invalid');
          }
          if (deployment.projectId !== env.VERCEL_PROJECT_ID || deployment.target !== 'production' || deployment.readyState !== 'READY') {
            throw new Error('Candidate must be ready and built for this production project');
          }
          if (deployment.meta?.releaseCommit !== env.SOURCE_COMMIT || deployment.meta?.githubCommitSha !== env.SOURCE_COMMIT || deployment.meta?.releaseTree !== env.SOURCE_TREE) {
            throw new Error('Candidate source metadata does not match the reviewed commit and tree');
          }
          if (deployment.gitSource?.sha && deployment.gitSource.sha !== env.SOURCE_COMMIT) {
            throw new Error('Candidate Git source contradicts the reviewed commit');
          }
          const evidence = {
            deployment_id: deployment.id,
            deployment_url: `https://${deployment.url}`,
            source_commit: env.SOURCE_COMMIT,
            source_tree: env.SOURCE_TREE,
            run_id: env.GITHUB_RUN_ID,
          };
          mkdirSync('artifacts/frontend-release', { recursive: true });
          writeFileSync('artifacts/frontend-release/deployment.json', JSON.stringify(evidence, null, 2) + '\n');
          appendFileSync(env.GITHUB_STEP_SUMMARY, `Verified candidate: ${evidence.deployment_url}\n\nDeployment ID: ${deployment.id}\n\nSource: ${env.SOURCE_COMMIT}\n\nTree: ${env.SOURCE_TREE}\n`);
          JS

      - name: Retain verified deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ github.run_id }}
          path: artifacts/frontend-release/deployment.json
          if-no-files-found: error
          retention-days: 30
