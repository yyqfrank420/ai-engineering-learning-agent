name: Deploy production

# One-time promotion of the candidate built by run 35658456534. The operations
# branch retains the reviewed source pin and verifies the deployment before promotion.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 6990ff9a91dd6a32c060a0834bf17ba60411ddc2
  SOURCE_TREE: 0e3fae183411133951680ee33b240e942e19ac9f
  VERCEL_CLI_VERSION: 50.42.0
  CANDIDATE_ID: dpl_77sBpq7ZvT9vkrEPLstKQFkdVh9h

jobs:
  frontend:
    name: Promote verified frontend candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6990ff9a91dd6a32c060a0834bf17ba60411ddc2
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION" --no-audit --no-fund

      - name: Verify deployment identity and record public evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          const env = process.env;
          const idPattern = /^dpl_[A-Za-z0-9]+$/;
          const hostPattern = /^[a-z0-9][a-z0-9.-]*\.vercel\.app$/;
          const reference = env.CANDIDATE_ID;
          if (!idPattern.test(reference)) throw new Error('Promotion requires an exact deployment ID');
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(reference)}`);
          endpoint.searchParams.set('teamId', env.VERCEL_ORG_ID);
          endpoint.searchParams.set('withGitRepoInfo', 'true');
          const response = await fetch(endpoint, {
            headers: { Authorization: `Bearer ${env.VERCEL_TOKEN}` },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Deployment verification returned HTTP ${response.status}`);
          const deployment = await response.json();
          if (deployment.id !== reference || !hostPattern.test(deployment.url)) {
            throw new Error('Deployment identity is missing or invalid');
          }
          if (deployment.projectId !== env.VERCEL_PROJECT_ID || deployment.target !== 'production' || deployment.readyState !== 'READY') {
            throw new Error('Candidate must be ready and built for this production project');
          }
          if (deployment.meta?.releaseCommit !== env.SOURCE_COMMIT || deployment.meta?.githubCommitSha !== env.SOURCE_COMMIT || deployment.meta?.releaseTree !== env.SOURCE_TREE) {
            throw new Error('Candidate source metadata does not match the reviewed commit and tree');
          }
          if (deployment.gitSource?.sha && deployment.gitSource.sha !== env.SOURCE_COMMIT) {
            throw new Error('Candidate Git source contradicts the reviewed commit');
          }
          const evidence = {
            deployment_id: deployment.id,
            deployment_url: `https://${deployment.url}`,
            source_commit: env.SOURCE_COMMIT,
            source_tree: env.SOURCE_TREE,
            run_id: env.GITHUB_RUN_ID,
          };
          mkdirSync('artifacts/frontend-release', { recursive: true });
          writeFileSync('artifacts/frontend-release/deployment.json', JSON.stringify(evidence, null, 2) + '\n');
          appendFileSync(env.GITHUB_STEP_SUMMARY, `Verified candidate: ${evidence.deployment_url}\n\nDeployment ID: ${deployment.id}\n\nSource: ${env.SOURCE_COMMIT}\n\nTree: ${env.SOURCE_TREE}\n`);
          JS

      - name: Retain verified deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-promotion-${{ github.run_id }}
          path: artifacts/frontend-release/deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Promote only the verified candidate
        working-directory: frontend
        run: vercel promote "$CANDIDATE_ID" --yes --token="$VERCEL_TOKEN"
