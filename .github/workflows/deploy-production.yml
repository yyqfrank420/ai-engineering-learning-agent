name: Inspect deployment identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    name: Inspect ${{ matrix.environment }} identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [staging-eval, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Inspect public OIDC claims and configured account selection
        env:
          SELECTED_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SELECTED_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ENVIRONMENT_NAME: ${{ matrix.environment }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, urllib.parse, urllib.request
          from pathlib import Path
          audience = "https://iam.googleapis.com/" + os.environ["SELECTED_PROVIDER"]
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(audience, safe="")
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          environment = os.environ["ENVIRONMENT_NAME"]
          account_name = "staging" if environment == "staging-eval" else "production"
          expected_account = f"github-actions-{account_name}@project-c170fa55-f0d5-4d83-bfe.iam.gserviceaccount.com"
          expected_provider = "projects/36026643063/locations/global/workloadIdentityPools/github-actions/providers/github"
          report = {
              "environment": environment,
              "scoped_account_selected": os.environ["SELECTED_ACCOUNT"] == expected_account,
              "expected_provider_selected": os.environ["SELECTED_PROVIDER"] == expected_provider,
              "claims": {key: claims.get(key) for key in ("sub", "repository", "repository_id", "repository_owner_id", "environment", "ref", "workflow_ref")},
          }
          Path("identity.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PYTHON
      - name: Authenticate scoped account
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read exact approved image
        run: gcloud artifacts docker images describe europe-west2-docker.pkg.dev/project-c170fa55-f0d5-4d83-bfe/agent-backend/agent-backend:approved-tree-0e3fae183411133951680ee33b240e942e19ac9f --format='value(image_summary.digest)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-${{ matrix.environment }}
          path: identity.json
          retention-days: 7
