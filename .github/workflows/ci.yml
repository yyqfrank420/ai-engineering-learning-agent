name: CI required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Load canonical manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: groups
        run: ./scripts/ci groups --event-file "$GITHUB_EVENT_PATH" --github-output

  offline:
    name: Offline (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: manifest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python' || matrix.runtime == 'infra'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-eval.txt
            ingestion/requirements.txt

      - name: Install Python quality dependencies
        if: matrix.runtime == 'python' || matrix.runtime == 'infra'
        run: pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.runtime == 'node'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: hashicorp/setup-terraform@v3
        if: matrix.runtime == 'infra'
        with:
          terraform_version: 1.11.4

      - name: Start disposable Postgres for storage checks
        if: matrix.group == 'backend-coverage' || matrix.group == 'storage-security' || matrix.group == 'infra-migrations'
        run: |
          docker run --detach --name ci-storage-postgres --publish 127.0.0.1::5432 --env POSTGRES_PASSWORD=ci-local-only postgres:17.6
          for attempt in $(seq 1 30); do
            if docker exec ci-storage-postgres pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec ci-storage-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          port="$(docker port ci-storage-postgres 5432/tcp | cut -d: -f2)"
          echo "MESSAGE_SEQUENCE_TEST_DATABASE_URL=postgresql://postgres:ci-local-only@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"

      - name: Run canonical offline group
        run: ./scripts/ci offline --group '${{ matrix.group }}' --event-file "$GITHUB_EVENT_PATH"

      - name: Stop disposable Postgres
        if: always() && (matrix.group == 'backend-coverage' || matrix.group == 'storage-security' || matrix.group == 'infra-migrations')
        run: docker rm --force ci-storage-postgres

  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs: [manifest, offline]
    steps:
      - name: Require every selected canonical offline group
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: |
          if [ "$MANIFEST_RESULT" != success ] || [ "$OFFLINE_RESULT" != success ]; then
            echo "Canonical offline quality checks failed." >&2
            exit 1
          fi
          echo "All selected canonical offline quality groups passed."
